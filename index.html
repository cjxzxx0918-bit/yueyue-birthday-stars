:root{color-scheme:light;--ink:#5b5548;--soft:#817b6f;--gold:#af8c51;--paper:#f6f0e6}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--paper);color:var(--ink);font-family:BirthdaySerif,'Noto Serif SC','Songti SC','SimSun',serif;-webkit-tap-highlight-color:transparent}#paper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65;pointer-events:none;user-select:none}#theatre{position:fixed;inset:0;background:#17131b;opacity:0;pointer-events:none}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;color:inherit}button:focus-visible{outline:1px solid #8c704b;outline-offset:7px}button:disabled{cursor:wait}#scene,#particles{position:fixed;inset:0;display:block;width:100%;height:100%;pointer-events:none}
header{position:fixed;z-index:5;inset:max(16px,env(safe-area-inset-top)) 15px auto auto}.icon-button{display:grid;place-items:center;width:44px;height:44px;padding:12px;color:var(--soft);transition:opacity .3s}.icon-button img{width:22px;height:22px;opacity:.50}.icon-button:hover img{opacity:.85}
#intro{position:fixed;z-index:4;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;transition:opacity 1s,transform 1s}.invitation{padding:30px;margin-top:-26px}.eyebrow{font-size:13px;letter-spacing:3px;color:#8c8170;margin:0 0 26px}.invitation h1{font-size:clamp(21px,4.8vw,28px);letter-spacing:3px;font-weight:400;line-height:1.8;margin:0 0 39px}.text-link{position:relative;font-size:15px;letter-spacing:3px;padding:12px 7px 14px;min-height:44px;text-decoration:underline;text-decoration-thickness:.65px;text-underline-offset:12px;text-decoration-color:#a99b85}.hint{font-size:12px;color:#a49987;letter-spacing:1.5px;line-height:1.9;margin:26px 0 0}#intro.leaving{opacity:0;transform:translateY(-10px);pointer-events:none}#intro[hidden]{display:none}
#greeting{position:fixed;z-index:2;left:50%;top:23.24%;transform:translate(-50%,-50%);margin:0;font-size:var(--title-size,24px);letter-spacing:.68em;padding-left:.68em;font-weight:400;white-space:nowrap;opacity:0;transition:none}#wish{position:fixed;z-index:2;left:50%;top:68.11%;transform:translate(-50%,-50%);margin:0;font-size:var(--wish-size,14px);letter-spacing:.035em;font-weight:400;white-space:nowrap;opacity:0;transition:none;color:#60594b}#whisper{position:fixed;z-index:3;left:20px;right:20px;top:77%;text-align:center;margin:0;font-size:14px;line-height:2;letter-spacing:1.3px;color:#706552;opacity:0}
#actions{position:fixed;z-index:3;left:50%;top:83.8%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:27px;opacity:0;white-space:nowrap;pointer-events:none}body.started #actions{pointer-events:auto}#replay{font-size:var(--replay-size,15px);letter-spacing:.15em;color:#797265;text-decoration-color:#958c7b;min-width:90px}#pause{position:fixed;z-index:4;left:18px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px;min-height:44px;padding:10px 7px;opacity:0;font-size:12px;letter-spacing:1.2px;color:#93856e;transition:opacity .5s}#pause img{width:13px;height:13px;opacity:.75}#pause[hidden]{display:none}#audio-note{position:fixed;top:70px;right:24px;left:24px;text-align:right;font:11px/1.7 sans-serif;color:#8f7960;z-index:8}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:700px){header{right:30px;top:24px}.invitation h1{font-size:27px}.invitation .eyebrow{font-size:14px}#pause{left:32px;bottom:24px}}
@media(max-height:540px) and (min-aspect-ratio:13/10){header{top:8px;right:10px}#greeting{top:13.8%}#wish{top:76%}#actions{top:92%}#pause{bottom:4px;left:16px}#whisper{top:78%}.invitation{margin-top:-10px}.eyebrow{margin-bottom:12px}.invitation h1{font-size:21px;margin-bottom:14px}.hint{margin-top:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
