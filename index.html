function buildParticles(){

function renderParticles(t){

/* 轻柔音乐盒编曲：经典《生日快乐》旋律，搭配分解和弦与短混响。 */

let reverb=null;

function score(){

async function start(){
 if(started)return;started=true;elapsed=0;lastTime=performance.now();stage=-1;paused=false;$('story').inert=false;document.body.classList.add('started');$('intro').classList.add('leaving');$('start').disabled=true;setTimeout(()=>{$('intro').style.display='none';$('intro').hidden=true;$('pause').focus({preventScroll:true});},950);
 try{if(!audioReady)reverb=initAudio();await audio.resume();score();}catch{$('audio-note').textContent='当前浏览器未能播放声音，动画可以继续观看。';$('sound').setAttribute('aria-label','音乐暂不可用');}
}
function syncPause(){ if(!paused)lastTime=performance.now();$('pause-label').textContent=paused?'继续':'暂停';$('pause').setAttribute('aria-label',paused?'继续动画和音乐':'暂停动画和音乐');$('pause-icon').setAttribute('d',paused?'M5 3l7 5-7 5Z':'M5 3v10M11 3v10');if(audio){if(paused)audio.suspend().catch(()=>{});else audio.resume().catch(()=>{});} }
function togglePause(){if(!started)return;paused=!paused;hiddenPause=false;syncPause();}
async function replay(){if(!started)return;elapsed=0;stage=-1;paused=false;hiddenPause=false;document.body.dataset.elapsed='0.00';$('progress').style.width='0%';setStage(0);renderSky(0);renderParticles(0);syncPause();if(audio){await audio.resume();score();}}
function toggleSound(){muted=!muted;$('sound').setAttribute('aria-pressed',String(!muted));$('sound').setAttribute('aria-label',muted?'开启音乐':'关闭音乐');document.querySelector('.sound-label').textContent=muted?'音乐关闭':'音乐开启';if(master)master.gain.setTargetAtTime(muted?0:.32,audio.currentTime,.12);}
document.addEventListener('visibilitychange',()=>{if(!started)return;if(document.hidden&&!paused){hiddenPause=true;paused=true;syncPause();}else if(!document.hidden&&hiddenPause){hiddenPause=false;paused=false;lastTime=performance.now();syncPause();}});
window.addEventListener('resize',resize);window.addEventListener('pointermove',e=>{pointer.x=(e.clientX/W-.5)*2;pointer.y=(e.clientY/H-.5)*2;},{passive:true});window.addEventListener('pointerleave',()=>{pointer.x=pointer.y=0;});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&started&&e.target===document.body){e.preventDefault();togglePause();}});
$('start').addEventListener('click',start);$('sound').addEventListener('click',toggleSound);$('pause').addEventListener('click',togglePause);$('replay').addEventListener('click',replay);
textShape();resize();
/* 可复核的静态帧入口，仅在地址含 ?preview=秒数 时启用。正常打开仍由点击开始。 */
const preview=new URLSearchParams(location.search).get('preview');
if(preview!==null&&Number.isFinite(Number(preview))){started=true;paused=true;elapsed=Math.max(0,Math.min(Number(preview),CONFIG.duration));$('story').inert=false;document.body.classList.add('started');$('intro').hidden=true;$('intro').style.display='none';syncPause();}
requestAnimationFrame(tick);
})();
