<script>
/* 更换收件人时，需要同步替换手写字迹资产；本文件内置所有资源，可离线打开。 */
const CONFIG={name:'悦悦',greeting:'生日快乐',wish:'愿新的一岁，自在、明亮。',duration:34};

'use strict';

let seed=9127103;function random(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;}const rand=(a,b)=>a+(b-a)*random(),clamp=x=>Math.max(0,Math.min(1,x));const smooth=x=>{x=clamp(x);return x*x*(3-2*x);},mix=(a,b,u)=>a+(b-a)*u;

}catch{$('particles').hidden=true;gpu=null;}

const tiers=[{r:155,y:35,h:70},{r:122,y:-25,h:60},{r:94,y:-76,h:51}];
function sampleSignature(){

 for(let yy=0;yy<c.height;yy+=2)for(let xx=0;xx<c.width;xx+=2)if(data[(Math.floor(yy)*c.width+Math.floor(xx))*4+3]>55)shape.push({x:xx/c.width,y:yy/c.height});
 if(!shape.length)throw new Error('empty signature');
}
function cakePoint(){
 let x=0,y=0,z=0,color=0,size=rand(.65,1.35),kind='cake',tier=0;const r=random(),pick=random();tier=pick<.49?0:(pick<.79?1:2);const q=tiers[tier],angle=rand(0,Math.PI*2);
 if(r<.40){const v=random(),rho=q.r*(1-.018*Math.cos(v*Math.PI));x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=q.y+v*q.h;color=tier===2?1:(random()<.70?0:4);if(v>.43&&v<.56){color=tier===2?2:3;size*=.6;}}
 else if(r<.56){const pickCap=random();tier=pickCap<.60?2:(pickCap<.85?1:0);const cap=tiers[tier],rho=(cap.r-4)*Math.sqrt(random());x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=cap.y-2.8*(1-rho*rho/(cap.r*cap.r))-rand(0,1.1);color=tier===2?1:(random()<.6?2:0);size*=.92;}
 else if(r<.74){tier=random()<.28?0:(random()<.45?1:2);const a=tiers[tier],rho=a.r+rand(-2,2)+Math.sin(angle*[13,10,8][tier])*1.8;x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=a.y+4+Math.pow(.5+.5*Math.sin(angle*[13,10,8][tier]),2)*5+rand(-2,2);color=1;size*=1.06;}
 else if(r<.82){const blossoms=[32,25,18][tier],center=Math.round(angle/(Math.PI*2)*blossoms)/blossoms*Math.PI*2,phi=rand(0,Math.PI*2),theta=rand(0,Math.PI*2),radius=rand(3,7),rho=q.r-5+Math.cos(phi)*radius;x=rho*Math.cos(center)+Math.cos(theta)*radius*.6;z=rho*Math.sin(center)+Math.sin(theta)*radius*.6;y=q.y-1-Math.abs(Math.sin(phi))*radius; color=1;size*=.95;}
 else if(r<.88){const rho=q.r+rand(-.6,.6);x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=q.y+q.h*(random()<.5?.96:.56)+rand(-.7,.7);color=random()<.65?0:2;size*=.9;}
 else if(r<.91){const rho=rand(167,176);x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=110+rand(-.8,.8);color=3;size*=.65;tier=0;}
 else if(r<.945){const a=rand(0,Math.PI*2);x=9*Math.cos(a);z=9*Math.sin(a);y=rand(-151,-76);color=Math.sin((y+151)*.20+a)>0.82?4:1;size*=1.2;kind='candle';tier=3;}
 else if(r<.96){y=rand(-177,-151);const a=rand(0,Math.PI*2),rho=(1-Math.abs((y+164)/13))*6;x=rho*Math.cos(a);z=rho*Math.sin(a);color=random()<.75?5:1;size*=1.3;kind='flame';tier=3.5;}
 else{const rho=q.r+rand(6,36);x=rho*Math.cos(angle);z=rho*Math.sin(angle);y=q.y+rand(-32,25);color=tier===2?1:2;size*=.72;kind='halo';}

}
function createParticles(){
 seed=9127103;const count=gpu?(W<700?34000:45000):(W<700?14500:19000);particles=[];
 for(let i=0;i<count;i++){const p=cakePoint(),a=rand(0,Math.PI*2),r=rand(140,340),q=shape[Math.floor(random()*shape.length)];particles.push({...p,tx:q.x,ty:q.y,ix:rand(-.65,.65),iy:rand(-.52,.52),sx:Math.cos(a)*r,sy:Math.sin(a)*r*.60-20,delay:rand(0,1)+p.tier*.78,phase:rand(0,6.28),speed:rand(.8,1.7),settle:random()});}

}
function resize(){
 const compact=W<700;W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(gpu){gpu.surface.width=canvas.width;gpu.surface.height=canvas.height;gpu.gl.viewport(0,0,canvas.width,canvas.height);}

}

function render(t){

 const angle=reduced?.23:.23+Math.max(0,Math.min(t,14)-4)*.095;pose={co:Math.cos(angle),si:Math.sin(angle),bob:reduced?0:Math.sin(t*.6)*1.5};

function setStage(t){const current=t<8.8?0:t<14?1:t<18.2?2:t<25.7?3:4;if(stage===current)return;stage=current;document.body.dataset.stage=['forming','cake','scatter','signature','letter'][current];

function tick(now){requestAnimationFrame(tick);const dt=lastTime?Math.max(0,(now-lastTime)/1000):0;lastTime=now;if(document.hidden)return;

/* 保留经典《生日快乐》音乐盒旋律。音色更柔和，末尾逐渐收音。 */
let audio=null,master=null,reverb=null,voices=[],muted=false;
function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('unsupported');audio=new AC();audio.onstatechange=()=>document.body.dataset.audioState=audio.state;master=audio.createGain();master.gain.value=muted?0:.27;const compressor=audio.createDynamicsCompressor();compressor.threshold.value=-14;compressor.ratio.value=3;master.connect(compressor);compressor.connect(audio.destination);reverb=audio.createConvolver();const len=audio.sampleRate*1.7,impulse=audio.createBuffer(2,len,audio.sampleRate);for(let channel=0;channel<2;channel++){const data=impulse.getChannelData(channel);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.24;}reverb.buffer=impulse;const wet=audio.createGain();wet.gain.value=.22;reverb.connect(wet);wet.connect(master);}

function score(){if(!audio)return;for(const o of voices){try{o.stop();}catch{}}voices=[];master.gain.cancelScheduledValues(audio.currentTime);master.gain.setValueAtTime(muted?0:.27,audio.currentTime);
 const notes=[[72,.5],[72,.5],[74,1],[72,1],[77,1],[76,2],[72,.5],[72,.5],[74,1],[72,1],[79,1],[77,2],[72,.5],[72,.5],[84,1],[81,1],[77,1],[76,1],[74,1],[82,.5],[82,.5],[81,1],[77,1],[79,1],[77,2]],chords=[[53,57,60],[48,52,55],[53,57,60],[55,59,62],[53,57,60],[50,53,57],[58,62,65],[53,57,60]],beat=60/102,begin=audio.currentTime+1.1;

}
